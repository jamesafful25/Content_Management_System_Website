
apiVersion: v1
kind: Service
metadata:
  name: cms-backend-service
  namespace: cms
  labels:
    app: cms-backend
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  type: ClusterIP
  selector:
    app: cms-backend
  ports:
    - name: http
      protocol: TCP
      port: 5000
      targetPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: cms-frontend-service
  namespace: cms
  labels:
    app: cms-frontend
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  type: ClusterIP
  selector:
    app: cms-frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
