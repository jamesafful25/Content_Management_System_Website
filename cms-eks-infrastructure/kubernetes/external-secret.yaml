apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cms-app-secrets
  namespace: cms
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: cms-aws-secrets-manager
    kind: SecretStore

  target:
    name: cms-app-secrets
    creationPolicy: Owner

  data:
    # JWT authentication secret
    - secretKey: JWT_SECRET
      remoteRef:
        key: cms/dev/application/jwt-secret

    # Runtime database credentials
    - secretKey: DB_USER
      remoteRef:
        key: cms/dev/database/runtime
        property: username

    - secretKey: DB_PASSWORD
      remoteRef:
        key: cms/dev/database/runtime
        property: password

    # Database migration credentials
    - secretKey: MIGRATION_DB_USER
      remoteRef:
        key: cms/dev/database/migration
        property: username

    - secretKey: MIGRATION_DB_PASSWORD
      remoteRef:
        key: cms/dev/database/migration
        property: password