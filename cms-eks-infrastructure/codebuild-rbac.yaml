apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cms-codebuild-deployer
  namespace: cms
rules:
  # Core Kubernetes resources
  - apiGroups: [""]
    resources:
      - configmaps
      - services
      - serviceaccounts
    verbs: ["get", "list", "watch", "create", "update", "patch"]

  - apiGroups: [""]
    resources:
      - pods
    verbs: ["get", "list", "watch", "delete"]

  - apiGroups: [""]
    resources:
      - pods/log
    verbs: ["get"]

  - apiGroups: [""]
    resources:
      - events
    verbs: ["get", "list", "watch"]

  # Application deployments
  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs: ["get", "list", "watch", "create", "update", "patch"]

  - apiGroups: ["apps"]
    resources:
      - replicasets
    verbs: ["get", "list", "watch"]

  # Database setup and migration Jobs
  - apiGroups: ["batch"]
    resources:
      - jobs
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Ingress
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch", "create", "update", "patch"]

  # External Secrets Operator
  - apiGroups: ["external-secrets.io"]
    resources:
      - externalsecrets
      - secretstores
    verbs: ["get", "list", "watch", "create", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cms-codebuild-deployer
  namespace: cms
subjects:
  - kind: Group
    name: cms-deployer
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: cms-codebuild-deployer
  apiGroup: rbac.authorization.k8s.io


---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cms-codebuild-db-admin
  namespace: cms-db-admin
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]

  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]

  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]

  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cms-codebuild-db-admin
  namespace: cms-db-admin
subjects:
  - kind: Group
    name: cms-deployer
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: cms-codebuild-db-admin
  apiGroup: rbac.authorization.k8s.io
